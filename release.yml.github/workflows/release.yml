name: Draft prerelease
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag and build
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match VERSION.' }
          ./scripts/Package.ps1
      - name: Create draft prerelease
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem artifacts/*-windows.zip, artifacts/*-source.zip, artifacts/SHA256SUMS.txt | ForEach-Object { $_.FullName })
          gh release create $env:GITHUB_REF_NAME @files --draft --prerelease --verify-tag --title "BlendPlus $env:GITHUB_REF_NAME" --notes-file CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { throw 'Could not create draft prerelease.' }
